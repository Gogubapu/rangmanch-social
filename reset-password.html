<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password | RangManch</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<main class="auth-layout">
<section class="auth-visual">
<a class="logo" href="/">Rang<span>Manch</span></a>
<div><p class="auth-eyebrow">ACCOUNT RECOVERY</p><h1>A fresh start<br><span>begins here.</span></h1><p>Choose a new password for your RangManch account.</p></div>
<small>Keep your account yours.</small>
</section>
<section class="auth-form-side">
<div class="auth-card">
<p class="auth-kicker">SECURE YOUR ACCOUNT</p>
<h2>Choose a new password</h2>
<p class="auth-sub">Use at least 8 characters.</p>
<form id="passwordResetForm">
<label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label>
<label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password"></label>
<button class="auth-submit" id="saveNewPassword" type="submit" disabled>Update password</button>
</form>
<p id="resetStatus" role="status" class="reset-status">Checking your secure reset link…</p>
<p class="auth-switch"><a href="/login">Back to login</a></p>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="password-reset.js"></script>
</body>
</html>
